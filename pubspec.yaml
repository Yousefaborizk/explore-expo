name: explore_expo
description: "Explore Expo - Exhibition Organization Portfolio"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.18.0

  # Animation
  flutter_animate: ^4.5.0

  # Local storage (theme + language)
  shared_preferences: ^2.2.0

  # Google Fonts (Cairo)
  google_fonts: ^6.2.1

  # Routing (URL-based navigation)
  go_router: ^14.6.2

  # Image picker
  image_picker: ^1.1.2

  # Open URLs
  url_launcher: ^6.3.1

  # Video playback
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Cached images
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/